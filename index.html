<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gonfleurs">
<meta name="theme-color" content="#f4f6f9">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<title>Suivi des gonfleurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#15181d; --ink-2:#4d5560; --muted:#7c8591;
  --line:#e3e7ec; --track:#edf0f4; --blue:#2a78d6; --blue-soft:#e3eefb; --blue-ink:#1b4f8f;
  --green-bg:#e6f5ec; --green-line:#b9e2c8; --green-ink:#17613a; --red:#c93a3a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1a1e24; --ink:#eef1f4; --ink-2:#b7bec7; --muted:#8a939e;
    --line:#2a3038; --track:#252b33; --blue:#3987e5; --blue-soft:#1d2b3d; --blue-ink:#a9cbf3;
    --green-bg:#16271d; --green-line:#24503a; --green-ink:#8fdcae; --red:#ec7a7a;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1,h2,.v,.n{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
h1{font-weight:700;font-size:30px;line-height:1.1;margin:0 0 4px}
h2{font-weight:700;font-size:22px;margin:30px 0 12px}
.date{color:var(--muted);font-size:14px;margin:0 0 24px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi p{margin:0}.kpi .l{font-size:14px;color:var(--ink-2)}
.kpi .v{font-weight:500;font-size:30px;font-variant-numeric:tabular-nums}
.stock{background:var(--green-bg);border:1px solid var(--green-line);border-radius:18px;padding:18px 20px;margin-bottom:22px;color:var(--green-ink)}
.stock .top{display:flex;justify-content:space-between;align-items:center}
.stock .l{font-weight:600;margin:0}.stock .v{font-weight:700;font-size:56px;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--card);margin-top:14px;overflow:hidden}
.meter span,.bar span{display:block;height:100%;background:var(--blue)}
.stock .s{font-size:13px;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 20px}
.head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 0;border-bottom:1px solid var(--line)}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.top2{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;flex:none;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;font-weight:600}
.name{flex:1;font-size:17px;font-weight:500;min-width:0}
.n{font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.pct{font-size:13px;color:var(--muted);min-width:52px;text-align:right}
.bar{height:7px;border-radius:4px;background:var(--track);margin:10px 0 0 50px;overflow:hidden}
.sub{margin:6px 0 0 50px;font-size:14px;color:var(--ink-2)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0}
.total .t{font-weight:600}.total small{font-family:"Figtree";font-size:14px;color:var(--muted)}
.search{width:100%;height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;margin-bottom:12px}
.group{padding:14px 0;border-bottom:1px solid var(--line)}.group:last-child{border-bottom:0}
.count{font-size:14px;color:var(--muted)}
.dl{list-style:none;margin:6px 0 0 50px;padding:0}
.dl li{padding:6px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}.dl li:first-child{border-top:0}
.dl small{display:block;font-size:13px;color:var(--muted)}
.empty{margin:6px 0 0 50px;font-size:14px;color:var(--muted)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink-2)}
.lock{max-width:360px;margin:12vh auto 0;text-align:center}
.lock p{color:var(--ink-2)}
.lock input{width:100%;height:52px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font-size:20px;text-align:center;letter-spacing:.1em;margin:8px 0 12px}
.btn{width:100%;height:50px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:21px;margin:10px 0 0}
.out{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer;padding:8px 0;margin-top:24px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.rtabs{display:flex;gap:6px;background:var(--track);border-radius:14px;padding:4px;margin:14px 0 6px}
.rtab{flex:1;height:44px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:16px;cursor:pointer;color:var(--ink-2)}
.rtab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Design coloré, identique à l'appli principale */
:root{ --bg:#f1f4f8; --line:#e2e7ee;
  --p0:#2563c9; --p1:#d9482b; --p2:#15855f; --p3:#8a3fc4; --p4:#c27a00; --p5:#c2336e; --p6:#0e7ea3; --p7:#5f7d12;
  --neg:#c93a3a; --h1:#0f4c8a; --h2:#15805c; --r:#1d5fae; }
@media (prefers-color-scheme: dark){ :root{ color-scheme:dark; --bg:#0f1318;
  --p0:#6d9ff0; --p1:#f08a6f; --p2:#4cc59a; --p3:#bf8cf0; --p4:#f0b54a; --p5:#f07aa9; --p6:#4fc0e3; --p7:#a6c955; --neg:#ef8080; --r:#6ea6ec; }
  body[data-region="guadeloupe"]{ --r:#3cc7cd !important; } }
body[data-region="guadeloupe"]{ --h1:#08747b; --h2:#cf4d33; --r:#0a7f87; }
body{ --blue:var(--r); }
.wrap{padding-top:16px}
.hero{background:radial-gradient(circle at 100% 0%,color-mix(in srgb, var(--h2) 75%, transparent) 0%,transparent 58%),linear-gradient(160deg,var(--h1),color-mix(in srgb, var(--h1) 78%, #000));color:#fff;border-radius:26px;padding:22px 20px 20px;margin:0 0 18px;box-shadow:0 10px 28px -14px var(--h1)}
.hero h1{color:#fff;font-size:28px}
.hero .date{color:rgba(255,255,255,.82);margin:2px 0 14px}
.rtabs{display:flex;gap:6px;border-radius:14px;padding:4px;background:rgba(255,255,255,.16);margin:0 0 20px}
.rtab{flex:1;height:44px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:16px;cursor:pointer;color:rgba(255,255,255,.9)}
.rtab[aria-selected="true"]{background:#fff;color:var(--h1);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rtab:focus-visible{outline-color:#fff}
.hs-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hs-l{margin:0;font-size:15px;font-weight:600;color:rgba(255,255,255,.9)}
.hs-l small{display:block;font-weight:500;font-size:13px;opacity:.85}
.hs-v{margin:0;font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:700;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums lining-nums}
.hero .meter{background:rgba(255,255,255,.22);height:12px;border-radius:6px;margin-top:16px;overflow:hidden}
.hero .meter span{display:block;height:100%;background:#fff;border-radius:6px}
.hs-s{margin:8px 0 0;font-size:13px;color:rgba(255,255,255,.88)}
.kpis{gap:10px;margin-bottom:8px}
.kpi{border:0;border-radius:18px;background:color-mix(in srgb, var(--c) 11%, var(--card))}
.kpi .l{display:flex;align-items:center;gap:7px;font-weight:500}
.kpi .l::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kpi .v{color:var(--c);font-weight:700;font-size:32px}
.h2row{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px}
.h2row h2{margin:0;font-size:21px}
.card{border-radius:22px;padding:4px 18px;box-shadow:0 1px 2px rgba(15,25,40,.05)}
.row{padding:16px 0}
.row .av,.group .av{background:color-mix(in srgb, var(--c) 16%, var(--card));color:var(--c);font-weight:700}
.row .n{color:var(--c);font-weight:700}
.bar{height:9px;border-radius:5px;background:color-mix(in srgb, var(--c) 12%, var(--track))}
.bar span{background:var(--c);border-radius:5px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 50px}
.st{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--track);color:var(--ink-2);font-variant-numeric:tabular-nums}
.st.main{background:color-mix(in srgb, var(--c) 13%, var(--card));color:var(--c)}
.st.neg{background:color-mix(in srgb, var(--neg) 14%, var(--card));color:var(--neg)}
.total .n{color:var(--r);font-weight:700}
.group .count{background:color-mix(in srgb, var(--c) 12%, var(--card));color:var(--c);font-weight:600;font-size:13px;border-radius:999px;padding:2px 10px}
.dl{border-left:2px solid color-mix(in srgb, var(--c) 35%, transparent);margin-left:18px;padding-left:22px}
.none{margin:14px 0;font-size:15px;color:var(--ink-2)}
.mi{display:flex;align-items:flex-start;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mchk{flex:none;width:24px;height:24px;margin-top:1px;border-radius:8px;border:2px solid var(--p4);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.mi.fait .mchk{background:var(--p2);border-color:var(--p2)}
.mt{flex:1;min-width:0;overflow-wrap:anywhere}
.mt small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mi.fait .mt{color:var(--muted)}.mi.fait .mx{text-decoration:line-through}
.msep{font-size:13px;font-weight:600;color:var(--muted);padding:12px 0 2px}
</style>
</head>
<body>
<main class="wrap" id="main">
  <form class="lock" id="lock" hidden>
    <h1>Suivi des gonfleurs</h1>
    <p>Entre le code d'accès qu'on t'a donné.</p>
    <label class="sr" for="code">Code d'accès</label>
    <input id="code" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button class="btn" id="go">Ouvrir</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <div id="app" hidden></div>
</main>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fr1 = n => n.toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
  const plur = (n,m) => n + " " + m + (n > 1 ? "s" : "");
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  const KEY = "gonfleurs:code";
  const ls = { get(){ try { return localStorage.getItem(KEY); } catch(e) { return null; } }, set(v){ try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch(e) {} } };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let D = null;
  const REGIONS = [{ id:"corse", nom:"Corse" }, { id:"guadeloupe", nom:"Guadeloupe" }];
  const lsR = { get(){ try { return localStorage.getItem("gonfleurs:region"); } catch(e) { return null; } }, set(v){ try { localStorage.setItem("gonfleurs:region", v); } catch(e) {} } };
  let R = REGIONS.some(r => r.id === lsR.get()) ? lsR.get() : "corse";
  const regDe = x => (x && x.region) || "corse";
  const eqR = () => D.equipe.filter(p => regDe(p) === R);
  const dosR = () => D.dossiers.filter(d => regDe(d) === R);
  const depR = () => (D.regions && D.regions[R]) || (R === "corse" ? { recus: D.recus || 0, majLe: D.majLe } : { recus: 0 });

  async function ouvrir(code){
    const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw { code: "reseau" };
    const f = await r.json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const cle = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:unb64(f.sel), iterations:250000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    let clair;
    try { clair = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(f.iv) }, cle, unb64(f.data)); }
    catch(e) { throw { code: "code" }; }
    return JSON.parse(new TextDecoder().decode(clair));
  }

  function verrou(msg){
    $("app").hidden = true; $("lock").hidden = false;
    $("err").textContent = msg || "";
    $("code").value = ""; $("code").focus();
  }

  async function charger(code, silencieux){
    try {
      D = await ouvrir(code);
      ls.set(code);
      $("lock").hidden = true; $("app").hidden = false;
      render();
    } catch (x) {
      if (x && x.code === "code") { ls.set(null); verrou(silencieux ? "" : "Ce code n'est pas le bon."); }
      else if (silencieux && D) { /* on garde l'affichage actuel */ }
      else verrou("Impossible de charger le suivi. Vérifie ta connexion.");
    }
  }

  $("lock").addEventListener("submit", async e => {
    e.preventDefault();
    const c = $("code").value.trim(); if (!c) return;
    $("go").disabled = true; $("err").textContent = "";
    await charger(c, false);
    $("go").disabled = false;
  });

  const nbSt = d => Math.max(1, parseInt(d.stations, 10) || 1);
  const stDe = L => L.reduce((a,d) => a + nbSt(d), 0);
  const quand = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d : null; };

  const PAL = ["--p0","--p1","--p2","--p3","--p4","--p5","--p6","--p7"];
  function colDe(id){ const ids = eqR().map(p => p.id).sort(); const i = ids.indexOf(id); return i < 0 ? "--muted" : PAL[i % PAL.length]; }
  function render(){
    const eq = eqR().sort((a,b) => b.donnes - a.donnes || a.nom.localeCompare(b.nom,"fr"));
    const recus = Number(depR().recus) || 0, distribues = eq.reduce((a,p) => a + p.donnes, 0), poses = stDe(dosR());
    const pct = recus ? distribues / recus * 100 : 0;
    const maj = quand(depR().majLe) || quand(D.exporteLe);
    document.body.dataset.region = R;
    const regNomR = (REGIONS.find(r => r.id === R) || {}).nom || "";
    const kpi = (l,v,c) => '<div class="kpi" style="--c:var('+c+')"><p class="l">'+l+'</p><p class="v">'+v+'</p></div>';
    let h = '<header class="hero"><h1>Suivi des gonfleurs</h1><p class="date">' + (maj ? "Mis à jour le " + maj.toLocaleDateString("fr-FR",{day:"numeric",month:"long"}) + " à " + maj.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "") + '</p>'
      + '<div class="rtabs" role="tablist" aria-label="Région">' + REGIONS.map(r => '<button type="button" class="rtab" role="tab" data-reg="'+r.id+'" aria-selected="'+(r.id===R)+'">'+esc(r.nom)+'</button>').join("") + '</div>'
      + '<div class="hs-top"><p class="hs-l">Reste au dépôt<small>'+esc(regNomR)+'</small></p><p class="hs-v">'+(recus - distribues)+'</p></div>'
      + '<div class="meter" role="img" aria-label="'+fr1(pct)+' % distribués"><span style="width:'+Math.min(100,pct).toFixed(1)+'%"></span></div>'
      + '<p class="hs-s">'+fr1(pct)+' % distribué, '+fr1(Math.max(0,100-pct))+' % encore en stock</p></header>';
    h += '<section class="kpis" aria-label="Résumé">' + kpi("Reçus au dépôt",recus,"--p0") + kpi("Distribués",distribues,"--p3") + kpi("Stations posées",poses,"--p2") + kpi("Encore en main",distribues - poses,"--p4") + '</section>';
    const max = Math.max(1, ...eq.map(p => p.donnes));
    h += '<div class="h2row"><h2>Équipe</h2><span class="count">'+plur(eq.length,"poseur")+'</span></div><section class="card" aria-label="Répartition par personne">';
    eq.forEach(p => {
      const L = dosR().filter(d => d.poseur === p.id), n = L.length, s = stDe(L), reste = p.donnes - s;
      const stats = '<span class="st">'+(n ? plur(n,"dossier") : "Aucun dossier")+'</span>' + (s !== n ? '<span class="st">'+s+' stations</span>' : '') + '<span class="st '+(reste < 0 ? "neg" : "main")+'">'+reste+' en main</span>';
      h += '<div class="row" style="--c:var('+colDe(p.id)+')"><div class="top2"><div class="av" aria-hidden="true">'+esc(p.nom.charAt(0).toUpperCase())+'</div><span class="name">'+esc(p.nom)+'</span><span class="n">'+p.donnes+'</span><span class="pct">'+(recus?fr1(p.donnes/recus*100):"0,0")+' %</span></div>'
        + '<div class="bar"><span style="width:'+(p.donnes/max*100).toFixed(1)+'%"></span></div><div class="stats">'+stats+'</div></div>';
    });
    if (!eq.length) h += '<p class="none">Aucun poseur pour l\'instant.</p>';
    h += '<div class="total"><span class="t">Total distribué</span><span class="n">'+distribues+' <small>/ '+recus+'</small></span></div></section>';
    const ML = (D.modifs || []).filter(m => regDe(m) === R);
    const todo = ML.filter(m => !m.fait).sort((a,b) => String(a.creeLe||"").localeCompare(String(b.creeLe||"")));
    const faites = ML.filter(m => m.fait).sort((a,b) => String(b.faitLe||"").localeCompare(String(a.faitLe||""))).slice(0, 10);
    const jour = iso => { const d = quand(iso); return d ? d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"}) : ""; };
    const item = m => '<div class="mi'+(m.fait ? ' fait' : '')+'"><span class="mchk" aria-hidden="true">'+(m.fait ? "✓" : "")+'</span><div class="mt"><span class="mx">'+esc(m.texte)+'</span><small>'+(m.fait ? "Faite le " + jour(m.faitLe) : "Ajoutée le " + jour(m.creeLe))+'</small></div></div>';
    h += '<div class="h2row"><h2>Modifications à faire</h2><span class="count">'+(todo.length ? todo.length + " à faire" : "")+'</span></div><section class="card" aria-label="Modifications à faire">'
      + (todo.length ? todo.map(item).join("") : '<p class="none">Rien à modifier pour l\'instant.</p>')
      + (faites.length ? '<p class="msep">Faites</p>' + faites.map(item).join("") : '') + '</section>';
    h += '<div class="h2row"><h2>Dossiers posés</h2></div><label class="sr" for="q">Rechercher un dossier</label><input class="search" id="q" type="search" placeholder="Rechercher un dossier" autocomplete="off">';
    h += '<section class="card" id="dossiers" aria-label="Dossiers posés par personne"></section>';
    h += '<button type="button" class="out" id="out">Se déconnecter</button>';
    $("app").innerHTML = h;
    $("q").addEventListener("input", renderDossiers);
    document.querySelectorAll("[data-reg]").forEach(b => b.addEventListener("click", () => { if (b.dataset.reg === R) return; R = b.dataset.reg; lsR.set(R); render(); window.scrollTo(0, 0); }));
    $("out").addEventListener("click", () => { ls.set(null); D = null; verrou(""); });
    renderDossiers();
  }

  function renderDossiers(){
    const q = norm($("q").value);
    const eq = eqR().sort((a,b) => b.donnes - a.donnes || a.nom.localeCompare(b.nom,"fr"));
    const ids = new Set(eq.map(p => p.id));
    const groups = eq.map(p => ({ id:p.id, nom:p.nom, list:dosR().filter(d => d.poseur === p.id) }));
    const autres = dosR().filter(d => !ids.has(d.poseur));
    if (autres.length) groups.push({ nom:"Autre", list:autres });
    let h = "", vu = 0;
    groups.forEach(g => {
      const L = g.list.filter(d => !q || norm(d.nom + " " + d.lieu).includes(q) || norm(g.nom).includes(q))
        .sort((a,b) => String(b.poseLe||"").localeCompare(String(a.poseLe||"")));
      if (q && !L.length) return;
      vu++;
      h += '<div class="group" style="--c:var('+(g.id ? colDe(g.id) : "--muted")+')"><div class="top2"><div class="av" aria-hidden="true">'+esc(g.nom.charAt(0).toUpperCase())+'</div><span class="name">'+esc(g.nom)+'</span><span class="count">'+plur(g.list.length,"dossier")+'</span></div>';
      if (!L.length) h += '<p class="empty">Aucun dossier</p>';
      else h += '<ul class="dl">' + L.map(d => {
        const bits = [], dt = quand(d.poseLe);
        if (nbSt(d) > 1) bits.push(nbSt(d) + " stations");
        if (dt) bits.push("posé le " + dt.toLocaleDateString("fr-FR",{day:"numeric",month:"long"}));
        if (d.lieu) bits.push("à " + d.lieu);
        const s = bits.join(", ");
        return '<li>'+esc(d.nom)+(s ? '<small>'+esc(s.charAt(0).toUpperCase()+s.slice(1))+'</small>' : '')+'</li>';
      }).join("") + '</ul>';
      h += '</div>';
    });
    $("dossiers").innerHTML = vu ? h : '<p class="msg" style="border:0">' + (q ? "Aucun dossier ne correspond." : "Aucun dossier pour l'instant.") + '</p>';
  }

  document.addEventListener("visibilitychange", () => { const c = ls.get(); if (!document.hidden && c && D) charger(c, true); });
  const c = ls.get();
  if (c) charger(c, true); else verrou("");
})();
</script>
</body>
</html>
